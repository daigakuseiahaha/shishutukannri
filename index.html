<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>シンプルお金管理</title>
<meta name="description" content="大学生がチャッピーに作らせたシンプルで見やすい支出管理アプリ。収入や支出を記録して、現在の残高や月ごとの履歴を簡単に管理できます。">
<link rel="icon" href="20260912_164508666_iOS.png">
<link rel="apple-touch-icon" href="20260912_164508666_iOS.png">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3936514447010992"
     crossorigin="anonymous"></script>
  
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#f7f7f8;
  --card:#ffffff;
  --text:#17181b;
  --sub:#777b84;
  --line:#e8e9ec;
  --accent:#111827;
  --income:#147d5a;
  --expense:#d94b4b;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:24px 18px 40px;
}

/* ヘッダー */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.logo{
  font-size:22px;
  font-weight:700;
  letter-spacing:-.5px;
}

.logo span{
  color:#777b84;
  font-weight:500;
}

.settings{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--line);
}

/* 残高 */
.balance-card{
  background:var(--accent);
  color:white;
  border-radius:24px;
  padding:25px 23px 22px;
  margin-bottom:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.balance-label{
  font-size:13px;
  opacity:.65;
  margin-bottom:7px;
}

.balance{
  font-size:40px;
  font-weight:750;
  letter-spacing:-1.5px;
  margin-bottom:22px;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.summary-item{
  background:rgba(255,255,255,.08);
  border-radius:14px;
  padding:12px 14px;
}

.summary-label{
  font-size:12px;
  opacity:.6;
  margin-bottom:4px;
}

.summary-value{
  font-size:15px;
  font-weight:650;
}

.summary-value.income{
  color:#78d9b3;
}

.summary-value.expense{
  color:#ff9b9b;
}

/* 入出金ボタン */
.action-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:14px;
}

.action{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  text-align:left;
  color:var(--text);
}

.action:active{
  transform:scale(.98);
}

.action-icon{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  margin-bottom:11px;
  font-size:18px;
}

.income-icon{
  background:#e8f7f1;
  color:var(--income);
}

.expense-icon{
  background:#fff0f0;
  color:var(--expense);
}

.action-title{
  font-weight:700;
  font-size:15px;
}

.action-sub{
  color:var(--sub);
  font-size:11px;
  margin-top:3px;
}

/* カード */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  margin-bottom:14px;
}

.card-title{
  font-size:16px;
  font-weight:700;
  margin:0 0 15px;
}



/* フォーム */
.form{
  display:none;
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid var(--line);
}

.form.show{
  display:block;
}

label{
  display:block;
  font-size:12px;
  color:var(--sub);
  margin:12px 0 6px;
}

input,select{
  width:100%;
  border:1px solid var(--line);
  background:#f8f8f9;
  border-radius:12px;
  padding:12px 13px;
  outline:none;
  color:var(--text);
}

input:focus,select:focus{
  border-color:#aeb2ba;
  background:var(--card);
}

.submit{
  width:100%;
  margin-top:15px;
  padding:13px;
  border-radius:12px;
  background:var(--accent);
  color:#fff;
  font-weight:700;
}

.submit.income-submit{
  background:var(--income);
}

.submit.expense-submit{
  background:var(--expense);
}

/* 月 */
.month{
  display:flex;
  align-items:center;
  gap:8px;
}

.month button{
  width:40px;
  height:40px;
  border-radius:11px;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--line);
}

.month input{
  margin:0;
  flex:1;
  text-align:center;
}

/* 履歴 */
.history{
  margin-top:2px;
}

.history-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.history-item:last-child{
  border-bottom:0;
}

.history-icon{
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
}

.history-info{
  flex:1;
  min-width:0;
}

.history-name{
  font-size:14px;
  font-weight:650;
}

.history-date{
  color:var(--sub);
  font-size:11px;
  margin-top:3px;
}

.history-amount{
  font-size:14px;
  font-weight:700;
}

.history-amount.income{
  color:var(--income);
}

.history-amount.expense{
  color:var(--expense);
}

.edit{
  margin-left:6px;
  padding:7px 9px;
  border-radius:9px;
  background:var(--bg);
  color:var(--accent);
  border:1px solid var(--line);
  font-size:11px;
}
  
.delete{
  margin-left:6px;
  padding:7px 9px;
  border-radius:9px;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--line);
  font-size:11px;
}

.empty{
  text-align:center;
  color:#999;
  padding:25px 5px 10px;
  font-size:13px;
}

/* データ管理 */
.data-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.data-buttons button{
  padding:11px 5px;
  border-radius:11px;
  background:#f3f4f6;
  color:#444;
  font-size:12px;
}

.clear{
  width:100%;
  margin-top:8px;
  padding:11px;
  border-radius:11px;
  background:#fff1f1!important;
  color:#c74747!important;
}

/* 広告スペース */
.ad-space{
  min-height:0;
  margin:8px 0;
  text-align:center;
  color:#b0b2b7;
  font-size:9px;
}

/* 小さい画面 */
@media(max-width:380px){
  .app{
    padding:20px 14px 35px;
  }

  .balance{
    font-size:34px;
  }

  .card{
    padding:17px;
  }
}

/* お知らせ */
.notice-list{
  display:flex;
  flex-direction:column;
}

.notice-empty{
  color:var(--sub);
  font-size:13px;
  padding:8px 0 0;
}

/* カテゴリ絞り込み */
.filter{
  margin-bottom:10px;
}

.filter select{
  width:100%;
  background:#f8f8f9;
}

/* ヘッダー */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    text-align: left;
}

.settings-button {
    width: 44px;
    height: 44px;
    padding: 0;
    margin: 0;
    border-radius: 12px;
    background: white;
    color: #333;
    font-size: 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* メニュー */
.menu-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1000;
}

.menu-overlay.show {
    display: block;
}

.menu {
    position: absolute;
    top: 0;
    right: 0;
    width: min(340px, 88%);
    height: 100%;
    background: #f5f6f8;
    padding: 24px 20px;
    overflow-y: auto;
    box-shadow: -5px 0 20px rgba(0,0,0,0.12);
}

.menu-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.menu-header h2 {
    margin: 0;
}

.menu-close {
    width: 42px;
    height: 42px;
    margin: 0;
    padding: 0;
    border-radius: 10px;
    background: white;
    color: #333;
    font-size: 22px;
}

.menu-section{
  background:var(--card);
  color:var(--text);
  border-radius:16px;
  padding:6px 16px;
  margin-bottom:16px;
}

.menu-section-title {
    font-size: 13px;
    color: #888;
    padding: 12px 0 6px;
}

.menu-item {
    width: 100%;
    margin: 0;
    padding: 15px 0;
    background: transparent;
    color: #222;
    text-align: left;
    border-radius: 0;
    border-bottom: 1px solid #eee;
}

.menu-item:last-child {
    border-bottom: none;
}

.menu-item.danger {
    color: #e53935;
}

/* =========================
   メニュー
========================= */

.menu-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:1000;
  justify-content:flex-end;
}

.menu-overlay.show{
  display:flex;
}

.menu{
  width:320px;
  max-width:85%;
  height:100%;
  background:#fff;
  padding:24px 20px;
  box-sizing:border-box;
  overflow-y:auto;
  box-shadow:-5px 0 20px rgba(0,0,0,.15);
}

.menu-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.menu-header h2{
  margin:0;
  font-size:22px;
}

.menu-close{
  border:none;
  background:none;
  font-size:22px;
  cursor:pointer;
  color:#555;
}

.menu-section{
  margin-bottom:28px;
}

.menu-section h3{
  font-size:13px;
  color:#888;
  margin:0 0 10px;
}

.menu-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 12px;
  margin-bottom:6px;
  border:none;
  border-radius:10px;
  background:#f5f6f8;
  font-size:15px;
  text-align:left;
  cursor:pointer;
  box-sizing:border-box;
}

.menu-item:hover{
  background:#e9ebef;
}

.menu-item.danger{
  color:#e53935;
}

.theme-item{
  cursor:default;
}

#themeColor{
  width:50px;
  height:34px;
  padding:2px;
  margin-left:auto;
  border:none;
  background:none;
}


/* =========================
   ダークモード
========================= */

body.dark{
  --bg:#111827;
  --card:#1f2937;
  --text:#f3f4f6;
  --sub:#9ca3af;
  --line:#374151;
  background:var(--bg);
  color:var(--text);
}

body.dark .menu{
  background:#1f2937;
  color:#f3f4f6;
}

body.dark .menu-item{
  background:#374151;
  color:#f3f4f6;
}

body.dark .menu-item:hover{
  background:#4b5563;
}

body.dark .menu-close{
  color:#f3f4f6;
}

body.dark input,
body.dark select{
  background:#374151;
  color:#f3f4f6;
  border-color:#4b5563;
}

body.dark .action-card,
body.dark .quick-card,
body.dark .history-card{
  background:#1f2937;
  border-color:#374151;
}

body.dark .month-button,
body.dark .filter-select{
  background:#374151;
  color:#f3f4f6;
  border-color:#4b5563;
}

@media (max-width:600px){
  #expenseSubmitButton{
    width:100%;
    min-width:0;
    height:50px;
    display:block;
    font-size:16px;
    padding:0 16px;
    white-space:nowrap;
    box-sizing:border-box;
  }
}

/* 支出グラフ */
.chart-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.chart-row{
  display:grid;
  grid-template-columns:72px 1fr 78px;
  align-items:center;
  gap:9px;
  font-size:12px;
}

.chart-label{
  white-space:nowrap;
}

.chart-bar-bg{
  height:11px;
  background:var(--line);
  border-radius:999px;
  overflow:hidden;
}

.chart-bar{
  height:100%;
  background:var(--expense);
  border-radius:999px;
  transition:width .3s ease;
}

.chart-amount{
  text-align:right;
  font-size:12px;
  font-weight:700;
}

.chart-empty{
  text-align:center;
  color:var(--sub);
  font-size:13px;
  padding:15px 0;
}

.chart-total{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid var(--line);
  font-size:13px;
}

.chart-total strong{
  font-size:16px;
}

/* =========================
   月別集計
========================= */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.monthly-summary-item{
  background:var(--bg);
  border-radius:12px;
  padding:14px 10px;
  text-align:center;
}

.monthly-summary-label{
  color:var(--sub);
  font-size:12px;
  margin-bottom:6px;
}

.monthly-summary-value{
  font-size:17px;
  font-weight:700;
}

.income-text{
  color:var(--income);
}

.expense-text{
  color:var(--expense);
}

.summary-balance{
  border:1px solid var(--line);
}

.summary-category-title{
  margin-top:22px;
  margin-bottom:12px;
  font-size:13px;
  font-weight:700;
}

.monthly-category-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.monthly-category-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.monthly-category-row:last-child{
  border-bottom:none;
}

.monthly-category-name{
  display:flex;
  align-items:center;
  gap:6px;
}

.monthly-category-amount{
  font-weight:700;
}

.monthly-category-empty{
  text-align:center;
  color:var(--sub);
  font-size:13px;
  padding:10px 0;
}

@media (max-width:600px){

  .summary-grid{
    gap:7px;
  }

  .monthly-summary-item{
    padding:12px 6px;
  }

  .monthly-summary-value{
    font-size:15px;
  }

}

/* =========================
   固定費
========================= */

.fixed-cost-panel{
  display:none;
}

.fixed-cost-panel.show{
  display:block;
}

.fixed-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:12px;
}

.fixed-item{
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--card);
}

.fixed-item-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.fixed-item-name{
  font-size:14px;
  font-weight:700;
}

.fixed-item-info{
  color:var(--sub);
  font-size:11px;
  margin-top:5px;
}

.fixed-item-actions{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.fixed-item-actions button{
  padding:6px 9px;
  border-radius:8px;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--line);
  font-size:11px;
}

.category-setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 0;
  border-bottom:1px solid var(--line);
}

.category-setting-row:last-child{
  border-bottom:none;
}

.category-setting-name{
  flex:1;
  min-width:0;
  font-size:14px;
}

.category-setting-buttons{
  display:flex;
  gap:5px;
}

.category-setting-buttons button{
  padding:6px 9px;
  border-radius:8px;
  background:#f1f1f2;
  color:#555;
  font-size:11px;
}

.category-setting-buttons .category-delete{
  color:#d94b4b;
}

body.dark .category-setting-buttons button{
  background:#374151;
  color:#f3f4f6;
}

/* =========================
   カテゴリ追加モーダル
========================= */

.category-modal{
  display:none;
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.45);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.category-modal.show{
  display:flex;
}

.category-modal-box{
  width:100%;
  max-width:360px;
  background:var(--card);
  border-radius:20px;
  padding:22px;
  box-shadow:0 10px 40px rgba(0,0,0,.2);
}

.category-modal-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:16px;
}

.category-modal-input{
  width:100%;
  height:50px;
  font-size:16px;
  margin-bottom:12px;
}

.category-modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.category-modal-buttons button{
  height:48px;
  border-radius:12px;
  font-weight:700;
}

.category-cancel{
  background:#f1f1f2;
  color:#555;
}

.category-add{
  background:#111827;
  color:white;
}

body.dark .category-modal-box{
  background:#1f2937;
}

body.dark .category-cancel{
  background:#374151;
  color:#f3f4f6;
}


  /* 既存のCSS */

.pc-side-ad {
  position: fixed;
  left: 10px;
  top: 120px;
  width: 160px;
  z-index: 1000;
}

@media (max-width: 768px) {
  .pc-side-ad {
    display: none;
  }
}

.installment-item {
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.installment-item-name {
  font-weight: 700;
  font-size: 14px;
}

.installment-item-info {
  color: var(--sub);
  font-size: 12px;
  line-height: 1.8;
  margin: 5px 0;
}

.installment-payment-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  background: var(--bg);
  font-size: 12px;
}

.installment-paid-button {
  padding: 9px 12px;
  border-radius: 9px;
  background: var(--income);
  color: white;
  white-space: nowrap;
}

.installment-note,
.installment-empty {
  font-size: 12px;
  color: var(--sub);
  line-height: 1.7;
  margin-top: 10px;
}
    
</style>
</head>
  
<body>

<div class="pc-side-ad">
  <!-- ここにAdSenseの広告ユニットコードを入れる -->
</div>

<div class="app">

<div class="header">
  <div class="logo">シンプル<span>お金管理</span></div>
  <button class="settings" onclick="openMenu()">⚙</button>
</div>

  <!-- 残高 -->
  <div class="balance-card">
    <div class="balance-label">現在の残高</div>
    <div class="balance" id="balance">¥0</div>

    <div class="summary">
      <div class="summary-item">
        <div class="summary-label">入金</div>
        <div class="summary-value income" id="incomeTotal">¥0</div>
      </div>

      <div class="summary-item">
        <div class="summary-label">支出</div>
        <div class="summary-value expense" id="expenseTotal">¥0</div>
      </div>
    </div>
  </div>

  <!-- 入出金 -->
  <div class="action-grid">

    <button class="action" onclick="toggleForm('incomeForm')">
      <div class="action-icon income-icon">＋</div>
      <div class="action-title">収入を追加</div>
      <div class="action-sub">給料・仕送りなど</div>
    </button>

    <button class="action" onclick="toggleForm('expenseForm')">
      <div class="action-icon expense-icon">−</div>
      <div class="action-title">支出を追加</div>
      <div class="action-sub">買い物・食費など</div>
    </button>

  </div>

  <!-- 収入フォーム -->

<script>

let data = JSON.parse(
  localStorage.getItem("expenseManagerData")
) || {
  incomes: [],
  expenses: [],
  fixedExpenses: [],
  installments: [],
  categories: []
};

if(!Array.isArray(data.fixedExpenses)){
  data.fixedExpenses = [];
}
if (!Array.isArray(data.installments)) {
  data.installments = [];
}

data.installments.forEach(item => {
  if (!Array.isArray(item.payments)) {
    item.payments = [];
  }
});
     
/* =========================
   カテゴリ
========================= */

const defaultCategories = [
  "食費",
  "交通費",
  "買い物",
  "娯楽",
  "通信費",
  "その他"
];

if(
  !Array.isArray(data.categories) ||
  data.categories.length === 0
){
  data.categories = [...defaultCategories];
}

const today = new Date();

document.getElementById("incomeDate").value = formatDate(today);
document.getElementById("expenseDate").value = formatDate(today);
document.getElementById("monthSelect").value = formatMonth(today);


/* 日付 */
function formatDate(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");

  return `${y}-${m}-${d}`;
}


/* 月 */
function formatMonth(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");

  return `${y}-${m}`;
}


/* 金額 */
function yen(amount){
  return "¥" + amount.toLocaleString("ja-JP");
}
  
/* 保存 */
function saveData(){
  localStorage.setItem(
    "expenseManagerData",
    JSON.stringify(data)
  );

  render();
}


/* フォーム表示 */
function toggleForm(id){

  const form = document.getElementById(id);

  form.classList.toggle("show");

  if(form.classList.contains("show")){
    form.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }
}


/* 収入 */
function addIncome(){

  const amount =
    Number(document.getElementById("incomeAmount").value);

  const date =
    document.getElementById("incomeDate").value;

  const memo =
    document.getElementById("incomeMemo").value.trim();

  if(!amount || amount <= 0){
    alert("金額を入力してください");
    return;
  }

  data.incomes.push({
    id:Date.now(),
    amount,
    date,
    memo:memo || "収入"
  });

  document.getElementById("incomeAmount").value="";
  document.getElementById("incomeMemo").value="";

  document.getElementById("incomeForm")
    .classList.remove("show");

  saveData();
}


/* 支出 */
function addExpense(){

  const amount =
    Number(document.getElementById("expenseAmount").value);

  const category =
    document.getElementById("category").value;

  const date =
    document.getElementById("expenseDate").value;

  const memo =
    document.getElementById("expenseMemo").value.trim();

  if(!amount || amount <= 0){
    alert("金額を入力してください");
    return;
  }

  data.expenses.push({
    id:Date.now(),
    amount,
    category,
    date,
    memo
  });

  document.getElementById("expenseAmount").value="";
  document.getElementById("expenseMemo").value="";

  document.getElementById("expenseForm")
    .classList.remove("show");

  saveData();
}

// 分割払いの回数を計算
function getInstallmentNumber(item, month) {
  if (month < item.startMonth) return 0;

  const start = new Date(item.startMonth + "-01");
  const target = new Date(month + "-01");

  const number =
    (target.getFullYear() - start.getFullYear()) * 12 +
    target.getMonth() - start.getMonth() + 1;

  return number >= 1 && number <= Number(item.count)
    ? number
    : 0;
}

// 1回あたりの支払額（端数は最終回に調整）
function getInstallmentAmount(item, number) {
  const total = Number(item.totalAmount);
  const count = Number(item.count);

  if (!number || !count) return 0;

  const base = Math.floor(total / count);

  return number === count
    ? total - base * (count - 1)
    : base;
}

// 各月の引き落とし日
function getInstallmentDueDate(item, month) {
  const [year, monthNumber] = month.split("-").map(Number);
  const lastDay = new Date(year, monthNumber, 0).getDate();
  const day = Math.min(Number(item.day), lastDay);

  return new Date(year, monthNumber - 1, day);
}

// その月の支払いが済んでいるか
function isInstallmentPaid(item, month) {
  return item.payments.some(p => p.month === month);
}

// 実際に支払い済みとした分割払いを取得
function getPaidInstallmentPaymentsForMonth(month) {
  const result = [];

  data.installments.forEach(item => {
    item.payments.forEach(payment => {
      if (!payment.paidAt || payment.paidAt.slice(0, 7) !== month) return;

      const number = getInstallmentNumber(item, payment.month);
      if (!number) return;

      result.push({
        item,
        payment,
        number,
        amount: getInstallmentAmount(item, number)
      });
    });
  });

  return result;
}

// 支払い済みの分割払い総額
function getPaidInstallmentExpenseTotal() {
  return data.installments.reduce((sum, item) => {
    return sum + item.payments.reduce((sub, payment) => {
      const number = getInstallmentNumber(item, payment.month);
      return sub + getInstallmentAmount(item, number);
    }, 0);
  }, 0);
}

// 分割払いを登録
function addInstallment() {
  const name =
    document.getElementById("installmentName").value.trim();
  const total =
    Number(document.getElementById("installmentTotal").value);
  const count =
    Number(document.getElementById("installmentCount").value);
  const category =
    document.getElementById("installmentCategory").value || "その他";
  const day =
    Number(document.getElementById("installmentDay").value);
  const startMonth =
    document.getElementById("installmentStartMonth").value;

  if (!name || !Number.isInteger(total) || total <= 0 ||
      !Number.isInteger(count) || count < 2 || count > 120 ||
      !Number.isInteger(day) || day < 1 || day > 31 ||
      !startMonth) {
    alert("すべての項目を正しく入力してください。");
    return;
  }

  data.installments.push({
    id: Date.now(),
    name,
    totalAmount: total,
    count,
    category,
    day,
    startMonth,
    payments: []
  });

  document.getElementById("installmentName").value = "";
  document.getElementById("installmentTotal").value = "";
  document.getElementById("installmentCount").value = "";
  document.getElementById("installmentDay").value = "";
  document.getElementById("installmentStartMonth").value = "";

  saveData();
}

// 分割払い一覧を表示
function renderInstallments() {
  const container = document.getElementById("installmentList");
  if (!container) return;

  if (!data.installments.length) {
    container.innerHTML =
      '<div class="installment-empty">分割払いはまだありません。</div>';
    return;
  }

  const today = new Date();
  const todayKey = formatDate(today);
  const currentMonth = formatMonth(today);

  container.innerHTML = data.installments.map(item => {
    const paidCount = item.payments.length;
    const rows = [];

    for (let i = 0; i < Number(item.count); i++) {
      const start = new Date(item.startMonth + "-01");
      start.setMonth(start.getMonth() + i);

      const month = formatMonth(start);
      if (month > currentMonth) break;

      const number = getInstallmentNumber(item, month);
      if (!number || isInstallmentPaid(item, month)) continue;

      const dueDate = getInstallmentDueDate(item, month);
      if (formatDate(dueDate) > todayKey) continue;

      rows.push(`
        <div class="installment-payment-row">
          <div>
            <div>${month}分・第${number}/${item.count}回</div>
            <strong>${yen(getInstallmentAmount(item, number))}</strong>
          </div>
          <button class="installment-paid-button"
            onclick="markInstallmentPaid(${item.id}, '${month}')">
            支払い済み
          </button>
        </div>
      `);
    }

    return `
         <div class="installment-item">
        <div class="installment-item-name">
          ${escapeHtml(item.name)}
        </div>

      <div class="installment-item-actions">
  <button type="button"
    onclick="editInstallment(${item.id})">
    編集
  </button>

  <button type="button"
    onclick="deleteInstallment(${item.id})">
    削除
  </button>
</div>
        <div class="installment-item-info">
          総額：${yen(item.totalAmount)}<br>
          ${escapeHtml(item.category)}・毎月${item.day}日<br>
          全${item.count}回・支払い済み ${paidCount}/${item.count}回
        </div>
        ${rows.length
          ? rows.join("")
          : '<div class="installment-empty">支払日を過ぎた未確認の引き落としはありません。</div>'}
      </div>
    `;
  }).join("");
}

// 分割払いの編集
function editInstallment(id) {
  const item = data.installments.find(x => x.id === id);
  if (!item) return;

  document.getElementById("installmentName").value = item.name;
  document.getElementById("installmentTotal").value = item.totalAmount;
  document.getElementById("installmentCount").value = item.count;
  document.getElementById("installmentCategory").value = item.category;
  document.getElementById("installmentDay").value = item.day;
  document.getElementById("installmentStartMonth").value = item.startMonth;

  const form = document.getElementById("installmentForm");
  form.classList.add("show");

  const button = form.querySelector(".submit");
  button.textContent = "変更を保存する";
  button.onclick = function () {
    updateInstallment(id);
  };

  form.scrollIntoView({ behavior: "smooth", block: "start" });
}

function updateInstallment(id) {
  const item = data.installments.find(x => x.id === id);
  if (!item) return;

  const name = document.getElementById("installmentName").value.trim();
  const totalAmount = Number(document.getElementById("installmentTotal").value);
  const count = Number(document.getElementById("installmentCount").value);
  const category = document.getElementById("installmentCategory").value;
  const day = Number(document.getElementById("installmentDay").value);
  const startMonth = document.getElementById("installmentStartMonth").value;

  if (!name || !category || !startMonth ||
      !Number.isFinite(totalAmount) || totalAmount <= 0 ||
      !Number.isInteger(count) || count < 1 ||
      !Number.isInteger(day) || day < 1 || day > 31) {
    alert("すべての項目を正しく入力してください。");
    return;
  }

  item.name = name;
  item.totalAmount = totalAmount;
  item.count = count;
  item.category = category;
  item.day = day;
  item.startMonth = startMonth;

  const form = document.getElementById("installmentForm");
  const button = form.querySelector(".submit");

  button.textContent = "分割払いを登録する";
  button.onclick = function () {
    addInstallment();
  };

  form.classList.remove("show");
  saveData();

  alert("分割払いを更新しました！");
}

// 分割払いの削除
function deleteInstallment(id) {
  const item = data.installments.find(x => x.id === id);
  if (!item) return;

  const confirmed = confirm(
    `「${item.name}」を削除しますか？\n支払い履歴も削除されます。この操作は取り消せません。`
  );

  if (!confirmed) return;

  data.installments = data.installments.filter(x => x.id !== id);

  saveData();

  alert("分割払いを削除しました。");
}


function markInstallmentPaid(id, month) {
  const item = data.installments.find(x => x.id === id);
  if (!item) return;

  if (isInstallmentPaid(item, month)) {
    alert("この月はすでに支払い済みです。");
    return;
  }

  const number = getInstallmentNumber(item, month);
  if (!number) {
    alert("この月の支払い情報がありません。");
    return;
  }

  const amount = getInstallmentAmount(item, number);

  item.payments.push({
    month: month,
    paidAt: formatDate(new Date()),
    amount: amount
  });

   saveData();
  alert("支払い済みに登録しました。");
}


/* =========================
   固定費の支払日判定
========================= */

function isFixedExpensePaid(item, month){

  if(item.active === false){
    return false;
  }

  if(!item.startMonth){
    return false;
  }

  if(item.startMonth > month){
    return false;
  }

  const year =
    Number(month.slice(0,4));

  const monthNumber =
    Number(month.slice(5,7));

  const lastDay =
    new Date(
      year,
      monthNumber,
      0
    ).getDate();

  const day =
    Math.min(
      Number(item.day),
      lastDay
    );

  const paymentDate =
    new Date(
      year,
      monthNumber - 1,
      day
    );

  const today =
    new Date();

  today.setHours(23,59,59,999);

  return paymentDate <= today;
}


/* 支払済み固定費の合計 */

function getPaidFixedExpenseTotal(){

  const today =
    new Date();

  const end =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );

  let total = 0;

  data.fixedExpenses.forEach(item => {

    if(item.active === false){
      return;
    }

    if(!item.startMonth){
      return;
    }

    let current =
      new Date(
        Number(item.startMonth.slice(0,4)),
        Number(item.startMonth.slice(5,7)) - 1,
        1
      );

    while(current <= end){

      const month =
        formatMonth(current);

      if(isFixedExpensePaid(item, month)){
        total += Number(item.amount);
      }

      current.setMonth(
        current.getMonth() + 1
      );
    }

  });

  return total;
}  

/* =========================
   表示
========================= */

function render(){

  const incomeTotal =
    data.incomes.reduce(
      (sum,item)=>sum + Number(item.amount),0
    );

  const normalExpenseTotal =
    data.expenses.reduce(
      (sum,item)=>sum + Number(item.amount),0
    );

  // 支払日を過ぎた固定費だけを支出として計算
  const fixedExpenseTotal =
    getPaidFixedExpenseTotal();

  const installmentExpenseTotal =
  getPaidInstallmentExpenseTotal();

const expenseTotal =
  normalExpenseTotal +
  fixedExpenseTotal +
  installmentExpenseTotal;

  const balance =
    incomeTotal - expenseTotal;

  document.getElementById("balance").textContent =
    yen(balance);

  document.getElementById("incomeTotal").textContent =
    yen(incomeTotal);

  document.getElementById("expenseTotal").textContent =
    yen(expenseTotal);

  renderHistory();
  renderMonthlySummary();
  renderExpenseChart();
renderInstallments();
}

/* =========================
   月別集計
========================= */

function renderMonthlySummary(){

const month =
  document.getElementById("monthSelect").value;

  /* 月の収入 */
  const monthlyIncome =
    data.incomes
      .filter(item => item.date.startsWith(month))
      .reduce(
        (sum,item) => sum + Number(item.amount),
        0
      );


  /* 通常の支出 */
  const normalExpense =
    data.expenses
      .filter(item => item.date.startsWith(month))
      .reduce(
        (sum,item) => sum + Number(item.amount),
        0
      );


  /* 支払日を迎えた固定費 */
  const fixedExpenses =
    data.fixedExpenses.filter(item =>
      isFixedExpensePaid(item, month)
    );


  /* 固定費合計 */
  const fixedExpense =
    fixedExpenses.reduce(
      (sum,item) => sum + Number(item.amount),
      0
    );


  /* 月の支出合計 */
 const installmentExpense =
  getPaidInstallmentPaymentsForMonth(month)
    .reduce((sum, payment) => sum + payment.amount, 0);

/* =========================
   支出グラフ
========================= */

function renderExpenseChart(){

  const month =
    document.getElementById("monthSelect").value;


  /* =========================
     カテゴリー
  ========================= */

const categories = {};

data.categories.forEach(category => {
  categories[category] = 0;
});


  /* =========================
     通常の支出
  ========================= */

  data.expenses
    .filter(item => item.date.startsWith(month))
    .forEach(item => {

      if(categories[item.category] !== undefined){

        categories[item.category] +=
          Number(item.amount);

      }

    });


  /* =========================
     固定費
     ・ONのものだけ
     ・開始月以降だけ
  ========================= */

  data.fixedExpenses
  .filter(item => {

    return isFixedExpensePaid(item, month);

  })
    .forEach(item => {

      if(categories[item.category] !== undefined){

        categories[item.category] +=
          Number(item.amount);

      }

    });

   
  /* =========================
     分割払い（支払い済みのみ）
  ========================= */

  getPaidInstallmentPaymentsForMonth(month).forEach(payment => {

    const category = payment.item.category || "その他";

    if (categories[category] === undefined) {
      categories[category] = 0;
    }

    categories[category] += payment.amount;

  });
  

  /* =========================
     金額の大きい順
  ========================= */

  const sortedCategories =
    Object.entries(categories)
      .filter(([category,amount]) => amount > 0)
      .sort((a,b) => b[1] - a[1]);


  const container =
    document.getElementById("expenseChart");


  /* =========================
     支出なし
  ========================= */

  if(sortedCategories.length === 0){

    container.innerHTML = `
      <div class="chart-empty">
        この月の支出はありません
      </div>
    `;

    return;
  }


  /* =========================
     最大金額
  ========================= */

  const maxAmount =
    sortedCategories[0][1];


  /* =========================
     グラフ表示
  ========================= */

  container.innerHTML = `

    <div class="chart-list">

      ${sortedCategories.map(([category,amount]) => {

        const width =
          (amount / maxAmount) * 100;

        return `

          <div class="chart-row">

            <div class="chart-label">
  ${getCategoryIcon(category)}
  ${escapeHtml(category)}
</div>

            <div class="chart-bar-bg">

              <div
                class="chart-bar"
                style="width:${width}%"
              ></div>

            </div>

            <div class="chart-amount">
              ${yen(amount)}
            </div>

          </div>

        `;

      }).join("")}

    </div>

  `;

}
  

/* 履歴 */
function renderHistory(){

  const month =
    document.getElementById("monthSelect").value;

  const filter =
    document.getElementById("categoryFilter").value;


  /* =========================
     収入
  ========================= */

  const incomes =
    data.incomes
      .filter(item=>item.date.startsWith(month))
      .map(item=>({
        ...item,
        type:"income"
      }));


  /* =========================
     通常の支出
  ========================= */

  const expenses =
    data.expenses
      .filter(item=>item.date.startsWith(month))
      .filter(item=>{
        return filter==="すべて" || item.category===filter;
      })
      .map(item=>({
        ...item,
        type:"expense"
      }));


  /* =========================
     固定費
  ========================= */

 const fixedExpenses =
  data.fixedExpenses
    .filter(item=>{

      return isFixedExpensePaid(item, month) &&
             (filter==="すべて" || item.category===filter);

    })
      .map(item=>{

        /* 選択した月の支払日を作る */

        const year =
          Number(month.slice(0,4));

        const monthNumber =
          Number(month.slice(5,7));

        /* 月末を超えないようにする */

        const lastDay =
          new Date(
            year,
            monthNumber,
            0
          ).getDate();

        const day =
          Math.min(
            Number(item.day),
            lastDay
          );

        const date =
          `${month}-${String(day).padStart(2,"0")}`;

        return {

          ...item,

          date:date,

          type:"fixed"

        };

      });


  /* =========================
     履歴をまとめる
  ========================= */

const installmentPayments =
  getPaidInstallmentPaymentsForMonth(month)
    .filter(payment =>
      filter === "すべて" ||
      payment.item.category === filter
    )
    .map(payment => ({
      id: payment.item.id,
      name: payment.item.name,
      category: payment.item.category || "その他",
      amount: payment.amount,
      date: payment.payment.paidAt,
      type: "installment"
    }));

let history;

if (filter === "すべて") {
  history = [
    ...incomes,
    ...expenses,
    ...fixedExpenses,
    ...installmentPayments
  ];
} else {
  history = [
    ...expenses,
    ...fixedExpenses,
    ...installmentPayments
  ];
}


  /* =========================
     日付順
  ========================= */

  history.sort((a,b)=>{

    return new Date(b.date) -
           new Date(a.date);

  });


  const container =
    document.getElementById("history");


  /* =========================
     履歴なし
  ========================= */

  if(history.length===0){

    container.innerHTML =
      `<div class="empty">該当する履歴はありません</div>`;

    return;

  }


  /* =========================
     表示
  ========================= */

  container.innerHTML =
    history.map(item=>{


      /* =========================
         収入
      ========================= */

      if(item.type==="income"){

        return `
        <div class="history-item">

          <div class="history-icon">
            ＋
          </div>

          <div class="history-info">

            <div class="history-name">
              ${escapeHtml(item.memo)}
            </div>

            <div class="history-date">
              ${item.date}
            </div>

          </div>

          <div class="history-amount income">
            +${yen(item.amount)}
          </div>

          <button
            class="edit"
            onclick="editIncome(${item.id})">
            編集
          </button>

          <button
            class="delete"
            onclick="deleteIncome(${item.id})">
            削除
          </button>

        </div>
        `;

      }


      /* =========================
         固定費
      ========================= */

      if(item.type==="fixed"){

        return `
        <div class="history-item">

          <div class="history-icon">
            ${getCategoryIcon(item.category)}
          </div>

          <div class="history-info">

            <div class="history-name">
              ${escapeHtml(item.name)}
              <span style="
                font-size:10px;
                color:var(--sub);
                margin-left:5px;
              ">
                固定費
              </span>
            </div>

            <div class="history-date">
              ${item.date}
              ・${escapeHtml(item.category)}
            </div>

          </div>

          <div class="history-amount expense">
            -${yen(item.amount)}
          </div>

        </div>
        `;

      }


      /* =========================
         分割払い
      ========================= */

      if (item.type === "installment") {
        return `
        <div class="history-item">

          <div class="history-icon">
            💳
          </div>

          <div class="history-info">

            <div class="history-name">
              ${escapeHtml(item.name)}
              <span style="
                font-size:10px;
                color:var(--sub);
                margin-left:5px;
              ">
                分割払い
              </span>
            </div>

            <div class="history-date">
              ${item.date}
              ・${escapeHtml(item.category)}
            </div>

          </div>

          <div class="history-amount expense">
            -${yen(item.amount)}
          </div>

        </div>
        `;
      }

         

      /* =========================
         通常の支出
      ========================= */

      return `
      <div class="history-item">

        <div class="history-icon">
          ${getCategoryIcon(item.category)}
        </div>

        <div class="history-info">

          <div class="history-name">
            ${escapeHtml(item.category)}
          </div>

          <div class="history-date">
            ${item.date}
            ${item.memo ? " · "+escapeHtml(item.memo) : ""}
          </div>

        </div>

        <div class="history-amount expense">
          -${yen(item.amount)}
        </div>

        <button
          class="edit"
          onclick="editExpense(${item.id})">
          編集
        </button>

        <button
          class="delete"
          onclick="deleteExpense(${item.id})">
          削除
        </button>

      </div>
      `;

    }).join("");

}

/* カテゴリ選択欄 */
function renderCategorySelects(){

  const selects =
    document.querySelectorAll("[data-category-select]");

  selects.forEach(select => {

    const currentValue = select.value;

    select.innerHTML = "";

    data.categories.forEach(category => {

      const option =
        document.createElement("option");

      option.value = category;

      option.textContent =
        `${getCategoryIcon(category)} ${category}`;

      select.appendChild(option);

    });

    if(data.categories.includes(currentValue)){
      select.value = currentValue;
    }

  });


  /* 履歴のカテゴリ絞り込み */

  const filter =
    document.getElementById("categoryFilter");

  if(filter){

    const currentValue =
      filter.value;

    filter.innerHTML =
      `<option value="すべて">すべて</option>`;

    data.categories.forEach(category => {

      const option =
        document.createElement("option");

      option.value = category;

      option.textContent =
        `${getCategoryIcon(category)} ${category}`;

      filter.appendChild(option);

    });

    if(
      currentValue === "すべて" ||
      data.categories.includes(currentValue)
    ){
      filter.value = currentValue;
    }

  }

}

/* カテゴリ追加 */

function confirmAddCategory(){

  const input =
    document.getElementById("newCategoryName");

  if(!input){
    return;
  }

  const newName =
    input.value.trim();


  /* 未入力 */

  if(!newName){

    alert("カテゴリ名を入力してください");

    input.focus();

    return;
  }


  /* 重複 */

  if(data.categories.includes(newName)){

    alert("同じカテゴリがすでにあります");

    input.focus();

    return;
  }


  /* カテゴリ追加 */

  data.categories.push(newName);


  /* 保存 */

  localStorage.setItem(
    "expenseManagerData",
    JSON.stringify(data)
  );


  /* 表示更新 */

  renderCategorySelects();
  renderCategorySettings();
  render();


  /* モーダルを閉じる */

  closeCategoryModal();


  alert(
    `「${newName}」をカテゴリに追加しました`
  );

}


/* カテゴリ名変更 */
function renameCategory(index){

  const oldName =
    data.categories[index];

  if(!oldName){
    return;
  }

  if(defaultCategories.includes(oldName)){
    alert("初期カテゴリは変更できません。");
    return;
  }

  const name =
    prompt(
      "新しいカテゴリ名を入力してください",
      oldName
    );

  if(name === null){
    return;
  }

  const trimmedName =
    name.trim();

  if(!trimmedName){
    alert("カテゴリ名を入力してください");
    return;
  }

  if(
    trimmedName !== oldName &&
    data.categories.includes(trimmedName)
  ){
    alert("同じカテゴリがすでにあります");
    return;
  }

  data.categories[index] =
    trimmedName;


  /* 通常の支出も変更 */

  data.expenses.forEach(item => {

    if(item.category === oldName){
      item.category = trimmedName;
    }

  });


  /* 固定費も変更 */

  data.fixedExpenses.forEach(item => {

    if(item.category === oldName){
      item.category = trimmedName;
    }

  });

  /* 分割払いも変更 */

  data.installments.forEach(item => {

    if(item.category === oldName){
      item.category = trimmedName;
    }

  });
     
  saveData();

  renderCategorySettings();
  renderCategorySelects();

  alert("カテゴリ名を変更しました");

}


/* カテゴリ削除 */
function deleteCategory(index){

  const category =
    data.categories[index];

  if(!category){
    return;
  }

  if(defaultCategories.includes(category)){
    alert("初期カテゴリは削除できません。");
    return;
  }

  const usedInExpenses =
    data.expenses.some(
      item => item.category === category
    );

  const usedInFixedExpenses =
    data.fixedExpenses.some(
      item => item.category === category
    );

  const usedInInstallments =
    data.installments.some(
      item => item.category === category
    );
     
   if(
    usedInExpenses ||
    usedInFixedExpenses ||
    usedInInstallments
  ){
       alert(
      "このカテゴリは支出・固定費・分割払いで使用されています。\n" +
      "先に該当するデータのカテゴリを変更してください。"
    );

    return;
  }

  if(
    !confirm(
      `「${category}」を削除しますか？`
    )
  ){
    return;
  }

  data.categories.splice(index,1);

  saveData();

  renderCategorySettings();
  renderCategorySelects();

}

/* HTML対策 */
function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

    }

  };

  reader.readAsText(file);
}

/* =========================
   固定費
========================= */

function toggleFixedCostPanel(){

  const panel =
    document.getElementById("fixedCostPanel");

  panel.classList.toggle("show");

  if(panel.classList.contains("show")){
    renderFixedCosts();
  }
}


/* 固定費追加 */

function addFixedCost(){

  const name =
    document.getElementById("fixedName").value.trim();

  const amount =
    Number(document.getElementById("fixedAmount").value);

  const category =
    document.getElementById("fixedCategory").value;

  const day =
    Number(document.getElementById("fixedDay").value);

  const startMonth =
    document.getElementById("fixedStartMonth").value;

  if(!name){
    alert("固定費の名前を入力してください");
    return;
  }

  if(!amount || amount <= 0){
    alert("金額を入力してください");
    return;
  }

  if(!day || day < 1 || day > 31){
    alert("支払日を1〜31で入力してください");
    return;
  }

  if(!startMonth){
    alert("開始月を入力してください");
    return;
  }

  data.fixedExpenses.push({

    id:Date.now(),

    name:name,

    amount:amount,

    category:category,

    day:day,

    startMonth:startMonth,

    active:true

  });

  document.getElementById("fixedName").value="";
  document.getElementById("fixedAmount").value="";
  document.getElementById("fixedDay").value="";

  saveData();

  renderFixedCosts();

  alert("固定費を登録しました");
}


/* 固定費表示 */

function renderFixedCosts(){

  const container =
    document.getElementById("fixedList");

  if(!container) return;

  if(data.fixedExpenses.length === 0){

    container.innerHTML = `
      <div class="monthly-category-empty">
        登録されている固定費はありません
      </div>
    `;

    return;
  }

  container.innerHTML = `

    <div class="fixed-list">

      ${data.fixedExpenses.map(item => `

        <div class="fixed-item">

          <div class="fixed-item-top">

            <div class="fixed-item-name">
              ${escapeHtml(item.name)}
            </div>

            <strong>
              ${yen(item.amount)}
            </strong>

          </div>

          <div class="fixed-item-info">

            ${getCategoryIcon(item.category)}
            ${escapeHtml(item.category)}
            ・毎月${item.day}日
            ・${escapeHtml(item.startMonth)}〜

          </div>

          <div class="fixed-item-actions">

            <button
              onclick="toggleFixedCost(${item.id})"
            >
              ${item.active === false ? "OFF" : "ON"}
            </button>

            <button
              onclick="editFixedCost(${item.id})"
            >
              編集
            </button>

            <button
              onclick="deleteFixedCost(${item.id})"
            >
              削除
            </button>

          </div>

        </div>

      `).join("")}

    </div>

  `;
}


/* ON / OFF */

function toggleFixedCost(id){

  const item =
    data.fixedExpenses.find(item => item.id === id);

  if(!item) return;

  item.active =
    item.active === false;

  saveData();

  renderFixedCosts();
}


/* 削除 */

function deleteFixedCost(id){

  if(!confirm("この固定費を削除しますか？")){
    return;
  }

  data.fixedExpenses =
    data.fixedExpenses.filter(
      item => item.id !== id
    );

  saveData();

  renderFixedCosts();
}


/* 編集 */

function editFixedCost(id){

  const item =
    data.fixedExpenses.find(item => item.id === id);

  if(!item) return;

  document.getElementById("fixedName").value =
    item.name;

  document.getElementById("fixedAmount").value =
    item.amount;

  document.getElementById("fixedCategory").value =
    item.category;

  document.getElementById("fixedDay").value =
    item.day;

  document.getElementById("fixedStartMonth").value =
    item.startMonth;

  const button =
    document.getElementById("fixedSubmitButton");

  button.textContent =
    "固定費を変更する";

  button.onclick = function(){

    updateFixedCost(id);

  };

}


/* 編集保存 */

function updateFixedCost(id){

  const item =
    data.fixedExpenses.find(item => item.id === id);

  if(!item) return;

  const name =
    document.getElementById("fixedName").value.trim();

  const amount =
    Number(document.getElementById("fixedAmount").value);

  const category =
    document.getElementById("fixedCategory").value;

  const day =
    Number(document.getElementById("fixedDay").value);

  const startMonth =
    document.getElementById("fixedStartMonth").value;

  if(!name){
    alert("固定費の名前を入力してください");
    return;
  }

  if(!amount || amount <= 0){
    alert("金額を入力してください");
    return;
  }

  if(!day || day < 1 || day > 31){
    alert("支払日を1〜31で入力してください");
    return;
  }

  if(!startMonth){
    alert("開始月を入力してください");
    return;
  }

  item.name = name;
  item.amount = amount;
  item.category = category;
  item.day = day;
  item.startMonth = startMonth;

  const button =
    document.getElementById("fixedSubmitButton");

  button.textContent =
    "固定費を登録する";

  button.onclick =
    addFixedCost;

  document.getElementById("fixedName").value="";
  document.getElementById("fixedAmount").value="";
  document.getElementById("fixedDay").value="";

  saveData();

  renderFixedCosts();

  alert("固定費を変更しました");
}
  

/* 全削除 */
function clearData(){

  if(
    !confirm(
      "すべての入金・支出データを削除しますか？"
    )
  ){
    return;
  }

data = {
  incomes: [],
  expenses: [],
  fixedExpenses: [],
  installments: [],
  categories: [...defaultCategories]
};

   saveData();

  renderCategorySelects();
  renderCategorySettings();
  renderFixedCosts();
  render();
}


/* =========================
   メニュー
========================= */

function openMenu(){
  document.getElementById("menuOverlay").classList.add("show");
}

function closeMenu(event){
  if(event && event.target !== event.currentTarget){
    return;
  }

  document.getElementById("menuOverlay").classList.remove("show");
}


/* =========================
   ダークモード
========================= */

function toggleDarkMode(){
  document.body.classList.toggle("dark");

  localStorage.setItem(
    "darkMode",
    document.body.classList.contains("dark") ? "on" : "off"
  );
}


/* =========================
   テーマカラー
========================= */

function changeTheme(color){
  document.documentElement.style.setProperty("--accent", color);
  localStorage.setItem("themeColor", color);
}


/* =========================
   保存されている設定を読み込む
========================= */

const savedTheme = localStorage.getItem("themeColor");

if(savedTheme){
  document.documentElement.style.setProperty("--accent", savedTheme);

  const themeInput = document.getElementById("themeColor");

  if(themeInput){
    themeInput.value = savedTheme;
  }
}


if(localStorage.getItem("darkMode") === "on"){
  document.body.classList.add("dark");
}


/* 初期表示 */
renderCategorySelects();
renderCategorySettings();
render();

</script>
